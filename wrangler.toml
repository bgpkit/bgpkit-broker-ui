name = "bgpkit-broker-ui"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Static assets configuration (required for Workers Static Assets)
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Workers build output directory
[build]
command = "npm run build"

# Custom domain configuration
#
# This Worker is no longer the broker page: broker.bgpkit.com belongs to the broker-next Worker, and
# this one answers the two legacy hostnames with the redirect in src/hooks.server.ts. The broker route
# is deliberately gone: while it was declared here, a deploy of this Worker silently took the live
# hostname over and replaced the current page with this one.
[[routes]]
pattern = "status.broker.bgpkit.com"
custom_domain = true

[[routes]]
pattern = "ui.broker.bgpkit.com"
custom_domain = true

# Optional: Environment variables (use wrangler secret put for sensitive values)
# [vars]
# MY_VAR = "value"

# KV namespace for ASN cache
[[kv_namespaces]]
binding = "ASN_CACHE"
id = "ff3519d8943041a883eaa415f52afa99"

# Optional: Durable Object binding
# [[durable_objects.bindings]]
# name = "MY_DURABLE_OBJECT"
# class_name = "MyDurableObject"
